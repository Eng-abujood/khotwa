<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - منصة خطوة</title>
    
    <!-- مكتبة EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* 1. إعدادات الصفحة الأساسية */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* 2. تأثير الزجاج (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h2 { margin-bottom: 15px; font-weight: 600; }
        p { margin-bottom: 25px; font-size: 0.95rem; opacity: 0.9; line-height: 1.5; }

        .input-group {
            text-align: right;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #333;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #764ba2;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { background: #f0f0f0; transform: scale(1.02); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .back-link { margin-top: 20px; display: block; color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; text-decoration: underline; }

        #msg { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; }

        /* إخفاء المرحلة الثانية بالبداية */
        #step2 { display: none; }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>استعادة كلمة المرور</h2>
        
        <!-- المرحلة الأولى: أدخل البريد -->
        <div id="step1">
            <p>أدخل بريدك الإلكتروني لإرسال رمز التحقق المكون من 6 أرقام.</p>
            <div class="input-group">
                <input type="email" id="emailField" placeholder="example@email.com" required>
            </div>
            <button id="sendOtpBtn">إرسال رمز التحقق</button>
        </div>

        <!-- المرحلة الثانية: الرمز + كلمة السر الجديدة -->
        <div id="step2">
            <p id="step2Desc">تم إرسال رمز التحقق إلى بريدك الإلكتروني.</p>

            <div class="input-group">
                <label>رمز التحقق (6 أرقام)</label>
                <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 4px; font-weight: bold;">
            </div>

            <div class="input-group">
                <label>كلمة المرور الجديدة</label>
                <input type="password" id="newPass" placeholder="••••••••" minlength="6">
            </div>

            <div class="input-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="confirmPass" placeholder="••••••••" minlength="6">
            </div>

            <button id="resetPassBtn">تحديث كلمة المرور</button>
        </div>
        
        <div id="msg"></div>
        
        <a href="index.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    
    // استيراد EmailJS بشكل صح داخل الـ Module
    import emailjs from "https://cdn.jsdelivr.net/npm/@emailjs/browser@3/+esm";

    // 1. مفاتيح EmailJS الخاصة بك
    const EMAILJS_PUBLIC_KEY = "2v_D_mEqMgYpgwPq1";
    const EMAILJS_SERVICE_ID = "service_0u0o85c";
    const EMAILJS_TEMPLATE_ID = "template_ja0a6t1";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    // 2. إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCj3TexX9Akm3Sbau58vqe9xRboB10tx2A",
        authDomain: "khotwa-bcae2.firebaseapp.com",
        projectId: "khotwa-bcae2",
        storageBucket: "khotwa-bcae2.firebasestorage.app",
        messagingSenderId: "235032470480",
        appId: "1:235032470480:web:d65d79cbd2502147ba0fd5",
        measurementId: "G-G1Z0NZZ3F3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

        // متغيرات حفظ الحالة المحلية
        let generatedOTP = null;
        let targetEmail = "";

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const emailField = document.getElementById('emailField');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const resetPassBtn = document.getElementById('resetPassBtn');
        const msg = document.getElementById('msg');

        // الخطوة 1: توليد الرمز وإرساله عبر EmailJS
        sendOtpBtn.addEventListener('click', async () => {
            targetEmail = emailField.value.trim();

            if (!targetEmail) {
                showMsg("الرجاء كتابة البريد الإلكتروني أولاً", "error");
                return;
            }

            sendOtpBtn.innerText = "جاري التحقق والإرسال...";
            sendOtpBtn.disabled = true;

            try {
                // الفحص في مجلد users_profiles بالضبط
                const usersRef = collection(db, "users_profiles");
                const q = query(usersRef, where("email", "==", targetEmail));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    showMsg("عذراً، هذا البريد غير مسجل بالموقع!", "error");
                    sendOtpBtn.innerText = "إرسال رمز التحقق";
                    sendOtpBtn.disabled = false;
                    return;
                }

                // توليد رمز عشوائي مكون من 6 أرقام
                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

                // إرسال الرمز عبر EmailJS
                const templateParams = {
                    to_email: targetEmail,
                    reset_code: generatedOTP
                };

                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

                showMsg("تم إرسال الرمز بنجاح إلى بريدك!", "success");
                
                // الانتقال للواجهة الثانية
                step1.style.display = "none";
                step2.style.display = "block";

            } catch (err) {
                showMsg("حدث خطأ أثناء الإرسال: " + (err.text || err.message), "error");
                sendOtpBtn.innerText = "إعادة المحاولة";
                sendOtpBtn.disabled = false;
            }
        });

        // الخطوة 2: التحقق من الرمز وتحديث كلمة السر في Firebase
        resetPassBtn.addEventListener('click', async () => {
            const userOTP = document.getElementById('otpInput').value.trim();
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            if (userOTP !== generatedOTP) {
                showMsg("رمز التحقق غير صحيح، تأكد من الرقم في الإيميل!", "error");
                return;
            }

            if (newPass.length < 6) {
                showMsg("كلمة المرور يجب أن تكون 6 خانات على الأقل!", "error");
                return;
            }

            if (newPass !== confirmPass) {
                showMsg("كلمتا المرور غير متطابقتين!", "error");
                return;
            }

            resetPassBtn.innerText = "جاري الحفظ في القاعدة...";
            resetPassBtn.disabled = true;

            try {
                // تحديث كلمة السر في مجلد users_profiles
                const usersRef = collection(db, "users_profiles");
                const q = query(usersRef, where("email", "==", targetEmail));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach(async (userDoc) => {
                    const userDocRef = doc(db, "users_profiles", userDoc.id);
                    await updateDoc(userDocRef, {
                        password: newPass
                    });

                    showMsg("تم تغيير كلمة المرور بنجاح! جاري تحويلك...", "success");
                    resetPassBtn.innerText = "تم التحديث بنجاح";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                });

            } catch (err) {
                showMsg("حدث خطأ أثناء تحديث البيانات: " + err.message, "error");
                resetPassBtn.innerText = "حفظ وإعادة المحاولة";
                resetPassBtn.disabled = false;
            }
        });

        function showMsg(text, type) {
            msg.innerText = text;
            msg.style.backgroundColor = type === "success" ? "rgba(46, 204, 113, 0.3)" : "rgba(231, 76, 60, 0.3)";
        }
    </script>
</body>
</html>
